# Services for local development: PostgreSQL, Redis, Temporal and two admin UIs.
# The app itself runs from source (see README). Not for production.
# Every password comes from .env (see .env.example); none has a default.

services:
  # Local PostgreSQL is optional (e.g. when DATABASE_URL points to Neon).
  # Start it with: docker compose -f docker-compose.dev.yaml --profile local-db up -d
  postnode-postgres:
    image: postgres:17.5-alpine
    container_name: postnode-postgres
    profiles: ['local-db']
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postnode-postgres-dev-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - postnode-network

  postnode-redis:
    image: redis:7.2.7-alpine
    container_name: postnode-redis
    restart: always
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    networks:
      - postnode-network

  postnode-pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: postnode-pgadmin
    profiles: ['local-db']
    restart: always
    ports:
      - 127.0.0.1:8085:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    networks:
      - postnode-network

  postnode-redisinsight:
    image: redis/redisinsight:2.60.0
    container_name: postnode-redisinsight
    links:
      - postnode-redis
    ports:
      - '127.0.0.1:5540:5540'
    volumes:
      - postnode-redisinsight-data:/data
    networks:
      - postnode-network
    restart: always

  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16.9
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    container_name: temporal
    restart: unless-stopped
    ports:
      - '127.0.0.1:7233:7233'
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_started
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./docker/temporal:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  postnode-redisinsight-data:
  postnode-postgres-dev-data:
    external: false

networks:
  postnode-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
